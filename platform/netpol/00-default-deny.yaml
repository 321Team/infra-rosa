# infra-rosa#7 — Namespace 기본 차단 (Ingress + Egress 모두)
# 초안 (2026-10-10, 미리뷰·미적용). __NS__ 는 #5 Namespace/Team Code 확정값으로 치환.
# 이 정책만 적용하면 DNS도 막힌다. 01~03을 함께 적용한다.
# 이름: fds-msa deploy/base의 앱 정책 `default-deny-all`과 겹치지 않도록 플랫폼 소유 이름을 쓴다(PR36·#43 정리 시 삭제 충돌 방지).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fds-platform-default-deny
  namespace: __NS__
  labels:
    project: fds-hybrid
    team: __TEAM__
    purpose: netpol-baseline
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
