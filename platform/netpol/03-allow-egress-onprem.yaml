# infra-rosa#7 — On-Prem 승인 경로만 Egress 허용
# 값은 baseline#37 handoff / Interface Register "승인" 상태만 사용한다.
# 2026-10-10 현재 후보값(확정 아님, 넣지 말 것):
#   IF-18 ROSA → db01 10.1.93.55 TCP 5432   (Register v3.1.19: PROVISIONAL — D21 PENDING)
#   IF-19 ROSA → harbor01 10.1.93.54 TCP 443 (D22 PENDING, 선택 안 되면 이 블록 삭제)
# 승인 전에는 __APPROVED_*__ 자리표시자가 남아 있어 적용 스크립트가 거부한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-onprem-approved
  namespace: __NS__
  labels:
    project: fds-hybrid
    team: __TEAM__
    purpose: netpol-hybrid
spec:
  # 승인 경로가 필요한 Pod만 연다. 라벨 없는 Pod는 같은 Namespace여도 차단(N1 시험).
  podSelector:
    matchLabels:
      onprem-egress: "true"
  policyTypes:
    - Egress
  egress:
    # IF-18 (승인 후 활성)
    - to:
        - ipBlock:
            cidr: __APPROVED_DB_IP__/32
      ports:
        - { protocol: TCP, port: __APPROVED_DB_PORT__ }
    # IF-19 (D22에서 선택된 경우에만 유지)
    - to:
        - ipBlock:
            cidr: __APPROVED_REG_IP__/32
      ports:
        - { protocol: TCP, port: __APPROVED_REG_PORT__ }
