# infra-rosa#5 ⑦ — 배포 SA·앱 SA·배포 Role/RoleBinding (정의 v3 §3-2 + v3.2 routes/custom-host create)
# Role 은 v3.2 정의보다 넓히지 않는다. delete·secrets·exec·rbac·SA/NetworkPolicy 쓰기·cluster-scope 없음.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fds-deployer
  namespace: ci-cd
  labels: {team: 321team, project: fds-hybrid, purpose: cicd}
automountServiceAccountToken: false
---
# 앱 SA 2개 — fds-msa deploy/base(c2372da) 이름 그대로, 추가 권한 binding 없음(§3-4)
# imagePullSecrets: Harbor(10.1.93.54) pull 전용 Secret 이름만 참조(infra-rosa#12 결정 6315085580). 새 Pod에만 상속.
# 이미 있는 SA에는 oc apply 대신 bootstrap/sa-pull-link.sh(link/revert, ACK 기반)로 추가·원복한다(apply는 목록을 통째로 바꿀 수 있음).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fds-engine-sa
  namespace: fds-app
  labels: {team: 321team, project: fds-hybrid, purpose: app}
automountServiceAccountToken: false
imagePullSecrets:
  - name: p2-coldpull-harbor-pull
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: transaction-api-sa
  namespace: fds-app
  labels: {team: 321team, project: fds-hybrid, purpose: app}
automountServiceAccountToken: false
imagePullSecrets:
  - name: p2-coldpull-harbor-pull
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fds-deployer
  namespace: fds-app
  labels: {team: 321team, project: fds-hybrid, purpose: app}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # v3.2/v3.3: host 지정 생성만. update 없음(host 변경 불가). host 불변 TLS 변경 잔여 권한은 v3.3 위험 수용.
  - apiGroups: ["route.openshift.io"]
    resources: ["routes/custom-host"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fds-deployer
  namespace: fds-app
  labels: {team: 321team, project: fds-hybrid, purpose: app}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fds-deployer
subjects:
  - kind: ServiceAccount
    name: fds-deployer
    namespace: ci-cd
